version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npx ng version
    build:
      commands:
        - npx ng build --configuration=production
    postBuild:
      commands:
        # Linux 用の sed コマンドでプレースホルダーを置換
        - sed -i 's/\$LIFFID/'"$LIFFID"'/g' dist/amplify-angular-template/browser/index.html
        - sed -i 's/\$LIFFID2/'"$LIFFID2"'/g' dist/amplify-angular-template/browser/index.html
        - sed -i 's/\$LIFFID3/'"$LIFFID3"'/g' dist/amplify-angular-template/browser/index.html
        - sed -i 's/\$PASSWORD/'"$PASSWORD"'/g' dist/amplify-angular-template/browser/index.html
  artifacts:
    baseDirectory: dist/amplify-angular-template/browser
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
